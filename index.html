<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Habitly</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Arial, sans-serif;
      color: #18312b;
      background: linear-gradient(135deg, #e8f7ef, #f5f1ff);
    }
    main {
      width: min(100%, 620px);
      padding: 48px 28px;
      text-align: center;
      background: #ffffff;
      border-radius: 24px;
      box-shadow: 0 16px 45px rgba(25, 55, 45, 0.12);
    }
    h1 {
      margin: 0 0 12px;
      font-size: clamp(2.5rem, 8vw, 4rem);
    }
    p {
      margin: 0;
      color: #5d716a;
      font-size: 1.1rem;
      line-height: 1.6;
    }
    .tag {
      margin-top: 24px;
      color: #287a58;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <main>
    <h1>Habitly</h1>
    <p>Small habits. Big progress.</p>
    <p class="tag">Created by: Naga Jyothi Kankara</p>
  </main>
</body>
</html>


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habitly - Daily Habit Tracker</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>

    <!-- Header -->
    <header class="header">
        <h1>Habitly 🌱</h1>
        <p id="currentDate"></p>
    </header>

    <main class="container">

        <!-- Welcome Section -->
        <section class="welcome">
            <h2 id="greeting">Welcome back! 👋</h2>
            <p>Small steps every day lead to big changes.</p>
        </section>

        <!-- Daily Quote -->
        <section class="quote-card">
            <h3>✨ Daily Motivation</h3>
            <p id="quote">Loading your daily quote...</p>
            <span id="quoteAuthor"></span>
        </section>

        <!-- Dashboard Statistics -->
        <section class="stats">

            <div class="stat-card">
                <h3>Done Today</h3>
                <p id="doneToday">0/0</p>
            </div>

            <div class="stat-card">
                <h3>Best Streak</h3>
                <p id="bestStreak">0 Days</p>
            </div>

            <div class="stat-card">
                <h3>This Week</h3>
                <p id="weeklyProgress">0%</p>
            </div>

        </section>

        <!-- Habit Section -->
        <section class="habit-section">

            <div class="section-heading">
                <h2>My Habits 🎯</h2>
            </div>

            <!-- Add Habit Form -->
            <form id="habitForm" class="habit-form">

                <input
                    type="text"
                    id="habitName"
                    placeholder="Enter a new habit"
                    maxlength="40"
                    required
                >

                <!-- Emoji Dropdown -->
                <select id="habitEmoji">

                    <option value="🌟">🌟 Star</option>
                    <option value="📚">📚 Books</option>
                    <option value="💧">💧 Water</option>
                    <option value="🏃">🏃 Exercise</option>
                    <option value="💻">💻 Coding</option>
                    <option value="🌙">🌙 Sleep</option>
                    <option value="🚶">🚶 Walking</option>
                    <option value="🧘">🧘 Meditation</option>
                    <option value="🍎">🍎 Healthy Food</option>
                    <option value="🎯">🎯 Goals</option>
                    <option value="🎨">🎨 Art</option>
                    <option value="✍️">✍️ Writing</option>
                    <option value="🎵">🎵 Music</option>
                    <option value="🏋️">🏋️ Fitness</option>
                    <option value="❤️">❤️ Health</option>
                    <option value="🌱">🌱 Growth</option>
                    <option value="🧹">🧹 Cleaning</option>
                    <option value="💰">💰 Saving</option>
                    <option value="📝">📝 Study</option>
                    <option value="🚴">🚴 Cycling</option>

                </select>

                <button type="submit">+ Add Habit</button>

            </form>

            <!-- Habits Display -->
            <div class="habit-grid" id="habitGrid"></div>

        </section>

    </main>

    <!-- Footer -->
    <footer>
        <p>Made with 💚 | CodGen Frontend Internship</p>
    </footer>

    <!-- JavaScript -->
    <script src="script.js"></script>

</body>
</html>
